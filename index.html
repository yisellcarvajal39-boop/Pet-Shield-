<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Pet Shield · Programa de fidelización</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   CLUB PET SHIELD — estilos
   Paleta: morado + beige + dorado + blanco (identidad Pet Shield).
   Tipografía: Fredoka (display, redonda y amigable — mascotas)
               + Inter (texto y datos).
   ========================================================= */

:root{
  --purple-900:#4B1F6F;
  --purple-700:#6A3294;
  --purple-600:#7C46A8;
  --purple-500:#8E5CB5;
  --purple-100:#EFE2F7;
  --beige-50:#F5EBDD;
  --beige:#E8D8C3;
  --gold-600:#AD8420;
  --gold-500:#D4AF37;
  --gold-400:#E8D28A;
  --gold-100:#F8EFD6;
  --gold-50:#FCF7EA;
  --white:#FFFFFF;
  --ink:#3A2A1F;
  --ink-soft:#7A6A57;
  --gray-200:#E3D6BF;
  --gray-100:#F2E9DA;
  --success:#3FA772;
  --danger:#C2554B;
  --radius-lg:26px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow-card:0 12px 30px -12px rgba(75,31,111,0.24);
  --shadow-soft:0 4px 14px -6px rgba(75,31,111,0.18);
  --font-display:'Fredoka', system-ui, sans-serif;
  --font-body:'Inter', system-ui, sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 0%, var(--purple-100) 0%, transparent 45%),
    radial-gradient(circle at 100% 15%, var(--gold-100) 0%, transparent 40%),
    var(--beige-50);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--purple-900);}
p{margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
input,select{font-family:var(--font-body);}
:focus-visible{outline:3px solid var(--gold-400); outline-offset:2px;}

.paw-bg{
  position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden;
}
.paw-bg span{
  position:absolute; font-size:34px; opacity:0.06; transform:rotate(-15deg);
}

/* ---------- Topbar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px clamp(16px,4vw,48px);
  background:var(--white);
  box-shadow:0 2px 18px -8px rgba(75,31,111,0.18);
  position:sticky; top:0; z-index:50;
  flex-wrap:wrap; gap:12px;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:46px; height:46px; border-radius:14px;
  background:linear-gradient(155deg,var(--purple-700),var(--purple-900));
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow-soft);
  flex-shrink:0;
}
.brand-mark svg{width:26px; height:26px;}
.brand-text h1{font-size:20px; letter-spacing:0.5px; line-height:1;}
.brand-text span{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:1.5px;}

.nav-tabs{display:flex; gap:6px; background:var(--gray-100); padding:5px; border-radius:999px;}
.nav-tabs button{
  border:none; background:transparent; padding:10px 18px; border-radius:999px;
  font-weight:600; font-size:14px; color:var(--ink-soft);
  transition:all .2s ease;
  display:flex; align-items:center; gap:6px;
}
.nav-tabs button.active{
  background:var(--purple-700); color:var(--white);
  box-shadow:var(--shadow-soft);
}
.nav-tabs button:hover:not(.active){color:var(--purple-700); background:var(--white);}

main{max-width:1180px; margin:0 auto; padding:clamp(18px,4vw,40px);}
.view{display:none; animation:fadeUp .35s ease;}
.view.active{display:block;}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Hero ---------- */
.hero{
  display:flex; align-items:center; justify-content:space-between; gap:28px;
  background:linear-gradient(120deg,var(--purple-700) 0%, var(--purple-900) 100%);
  border-radius:var(--radius-lg);
  padding:clamp(24px,4vw,42px);
  color:var(--white);
  margin-bottom:26px;
  position:relative; overflow:hidden;
}
.hero::before{
  content:"🐾"; position:absolute; font-size:220px; opacity:0.08; right:-30px; top:-50px; transform:rotate(18deg);
}
.hero-text h2{color:var(--white); font-size:clamp(24px,3.4vw,34px);}
.hero-text p{color:#F0E4D0; margin-top:8px; max-width:460px; font-size:15px;}
.hero-badge{
  background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.35);
  padding:6px 14px; border-radius:999px; font-size:12px; font-weight:600;
  display:inline-flex; align-items:center; gap:6px; margin-bottom:12px;
}

/* ---------- Layout grid registro ---------- */
.register-grid{
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; align-items:start;
}
.register-grid .form-panel{grid-column:1 / span 2;}
@media (max-width:980px){
  .register-grid{grid-template-columns:1fr;}
  .register-grid .form-panel{grid-column:1;}
}

.card{
  background:var(--white); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card); padding:24px;
}

.form-section{margin-bottom:22px;}
.form-section-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.step-badge{
  width:30px; height:30px; border-radius:50%; background:var(--purple-100); color:var(--purple-700);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--font-display); flex-shrink:0;
}
.form-section-head h3{font-size:16px; color:var(--purple-800,var(--purple-900));}

.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:560px){.field-grid{grid-template-columns:1fr;}}

.field label{
  display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;
}
.field input, .field select{
  width:100%; padding:11px 13px; border-radius:var(--radius-sm); border:1.5px solid var(--gray-200);
  background:var(--white); font-size:14px; color:var(--ink); transition:border-color .15s;
}
.field input:focus, .field select:focus{border-color:var(--purple-500);}
.field.error input, .field.error select{border-color:var(--danger);}
.field-error-msg{color:var(--danger); font-size:11.5px; margin-top:4px; display:none;}
.field.error .field-error-msg{display:block;}

.consent-box{
  display:flex; gap:10px; align-items:flex-start; background:var(--gold-100);
  padding:14px 16px; border-radius:var(--radius-md); font-size:13px; color:var(--ink); margin-top:6px;
}
.consent-box input{margin-top:3px; width:16px; height:16px; accent-color:var(--purple-700); flex-shrink:0;}

.btn{
  border:none; border-radius:999px; padding:14px 22px; font-weight:700; font-size:14.5px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .15s, box-shadow .15s;
}
.btn:active{transform:scale(0.97);}
.btn-primary{
  background:linear-gradient(120deg,var(--purple-700),var(--gold-500));
  color:var(--white); box-shadow:0 10px 22px -8px rgba(212,175,55,0.5); width:100%;
}
.btn-primary:hover{box-shadow:0 14px 26px -8px rgba(212,175,55,0.65);}
.btn-secondary{background:var(--purple-100); color:var(--purple-700);}
.btn-secondary:hover{background:var(--purple-500); color:var(--white);}
.btn-danger{background:#F6DEDB; color:var(--danger);}
.btn-danger:hover{background:var(--danger); color:var(--white);}
.btn-ghost{background:transparent; color:var(--purple-700); border:1.5px solid var(--purple-100);}
.btn-sm{padding:8px 14px; font-size:12.5px; border-radius:10px;}

/* ---------- Panel de bienvenida / tarjeta ---------- */
.welcome-panel{position:sticky; top:96px;}
.welcome-panel .card{
  background:linear-gradient(160deg,var(--white) 60%, var(--gold-100));
  text-align:center;
}
.welcome-icon{font-size:34px; margin-bottom:8px;}
.welcome-panel h3{font-size:17px; margin-bottom:4px;}
.welcome-panel p{font-size:13px; color:var(--ink-soft); margin-bottom:16px;}
.client-code-box{
  background:var(--purple-900); color:var(--white); border-radius:var(--radius-md);
  padding:14px; margin-bottom:18px;
}
.client-code-box span{display:block; font-size:11px; letter-spacing:1px; opacity:0.75; text-transform:uppercase;}
.client-code-box strong{font-family:var(--font-display); font-size:22px; letter-spacing:1px;}

.stamp-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:14px 0;}
.stamp{
  width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:16px; border:2px dashed var(--gray-200); color:var(--gray-200); background:var(--white);
  transition:transform .25s, background .25s, border-color .25s, color .25s;
}
.picker-hint{
  font-size:12.5px; color:var(--ink-soft); background:var(--purple-100); border-radius:var(--radius-md);
  padding:10px 14px; margin-bottom:12px;
}
.stamp-row button.stamp{
  cursor:pointer; padding:0; font-family:var(--font-body); appearance:none;
}
.stamp-row button.stamp:hover:not(.filled){
  border-color:var(--purple-500); color:var(--purple-500); background:var(--purple-100);
}
.stamp.filled{
  border:2px solid var(--gold-500); background:linear-gradient(135deg,var(--purple-700),var(--gold-500));
  color:var(--white); transform:scale(1.05);
  box-shadow:0 4px 10px -3px rgba(212,175,55,0.55);
  animation:stampPop .35s ease;
}
@keyframes stampPop{0%{transform:scale(0.4) rotate(-25deg); opacity:0;} 70%{transform:scale(1.15) rotate(6deg);} 100%{transform:scale(1.05) rotate(0);}}

.progress-track{
  height:10px; border-radius:999px; background:var(--gray-100); overflow:hidden; margin:10px 0;
}
.progress-fill{
  height:100%; border-radius:999px; background:linear-gradient(90deg,var(--purple-700),var(--gold-500));
  transition:width .4s ease;
}
.progress-caption{font-size:12.5px; color:var(--ink-soft);}
.complete-banner{
  margin-top:14px; background:linear-gradient(120deg,var(--gold-400),var(--gold-500)); color:var(--purple-900);
  padding:12px; border-radius:var(--radius-md); font-weight:700; font-size:13px; display:none;
}
.complete-banner.show{display:block;}

.hidden{display:none !important;}

/* ---------- Lookup ---------- */
.lookup-search{
  display:flex; gap:10px; max-width:520px; margin:0 auto 26px auto; flex-wrap:wrap;
}
.lookup-search input{flex:1; min-width:220px;}
.lookup-result{max-width:460px; margin:0 auto;}
.result-pet-row{
  display:flex; justify-content:space-between; gap:10px; margin:14px 0; font-size:13.5px;
}
.result-pet-row div span{display:block; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px;}
.result-pet-row div strong{font-family:var(--font-body); font-size:14.5px; color:var(--ink);}
.empty-state{
  text-align:center; color:var(--ink-soft); padding:34px 10px; font-size:14px;
}
.empty-state .emoji{font-size:38px; display:block; margin-bottom:10px;}

.quick-results{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; margin-top:22px;
}
.quick-card{
  background:var(--white); border-radius:var(--radius-lg); box-shadow:var(--shadow-soft); padding:18px;
}
.quick-card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:4px;}
.quick-card-head strong{font-size:15px;}
.quick-pet{display:block; font-size:12px; color:var(--ink-soft); margin-top:2px;}
.quick-card .stamp-row{margin:14px 0; gap:5px;}
.quick-card .stamp{width:26px; height:26px; font-size:11px;}
.quick-card-actions{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap;}
.quick-complete{font-size:12px; font-weight:700; color:var(--gold-500);}
.quick-purchase-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
.quick-purchase-row label{display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;}
.quick-purchase-row input, .quick-purchase-row select{width:100%; padding:9px 10px; border-radius:var(--radius-sm); border:1.5px solid var(--gray-200); font-size:13px;}
.quick-amount-display{
  margin-top:10px; text-align:center; font-size:13px; color:var(--ink-soft);
  background:var(--beige-50); border-radius:var(--radius-sm); padding:8px;
}
.quick-amount-display strong{color:var(--purple-900); font-size:15px;}
.quick-btn-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}

/* ---------- Admin ---------- */
.gate-wrap{max-width:400px; margin:60px auto; text-align:center;}
.gate-wrap .lock-icon{
  width:64px; height:64px; border-radius:50%; background:var(--purple-100); color:var(--purple-700);
  display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 16px auto;
}
.gate-error{color:var(--danger); font-size:13px; margin-top:10px; display:none; font-weight:600;}
.gate-error.show{display:block;}

.stats-row{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:22px;}
@media (max-width:700px){.stats-row{grid-template-columns:1fr;}}
.stat-card{
  background:var(--white); border-radius:var(--radius-md); padding:18px 20px; box-shadow:var(--shadow-soft);
  display:flex; align-items:center; gap:14px;
}
.stat-icon{
  width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;
  background:var(--purple-100);
}
.stat-card:nth-child(2) .stat-icon{background:var(--gold-100);}
.stat-card:nth-child(3) .stat-icon{background:var(--gold-50);}
.stat-num{font-family:var(--font-display); font-size:22px; color:var(--purple-900); line-height:1;}
.stat-label{font-size:12px; color:var(--ink-soft); margin-top:3px;}

.admin-toolbar{
  display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; justify-content:space-between;
}
.admin-toolbar .filters{display:flex; gap:10px; flex-wrap:wrap; flex:1;}
.admin-toolbar input, .admin-toolbar select{
  padding:10px 13px; border-radius:var(--radius-sm); border:1.5px solid var(--gray-200); font-size:13.5px;
}
.admin-toolbar input{min-width:220px; flex:1;}
.sellos-range{
  display:flex; align-items:center; gap:6px; background:var(--white); border:1.5px solid var(--gray-200);
  border-radius:var(--radius-sm); padding:0 10px;
}
.sellos-range-label{font-size:12.5px; color:var(--ink-soft); white-space:nowrap; font-weight:600;}
.sellos-range input{
  width:56px; min-width:0; flex:none; border:none; padding:10px 4px; text-align:center;
}
.sellos-range input:focus{outline:none;}
.sellos-range span{color:var(--ink-soft);}

.table-wrap{
  background:var(--white); border-radius:var(--radius-lg); box-shadow:var(--shadow-card);
  overflow:auto; max-height:70vh;
}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:1100px;}
thead th{
  position:sticky; top:0; background:var(--purple-900); color:var(--white); text-align:left;
  padding:12px 14px; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap;
}
tbody td{padding:12px 14px; border-bottom:1px solid var(--gray-100); white-space:nowrap; color:var(--ink);}
tbody tr:hover{background:var(--beige-50);}
.code-pill{
  background:var(--purple-100); color:var(--purple-700); padding:4px 10px; border-radius:999px; font-weight:700; font-size:12px;
}
.stamp-mini{font-size:12px; color:var(--ink-soft);}
.row-actions{display:flex; gap:6px;}
.icon-btn{
  border:none; background:var(--gray-100); width:30px; height:30px; border-radius:8px; font-size:13px;
  display:flex; align-items:center; justify-content:center; transition:background .15s;
}
.icon-btn:hover{background:var(--purple-100);}
.icon-btn.danger:hover{background:#F6DEDB;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(51,17,91,0.45); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:16px; backdrop-filter:blur(2px);
}
.modal-overlay.hidden{display:none;}
.modal-box{
  background:var(--white); border-radius:var(--radius-lg); padding:26px; max-width:640px; width:100%;
  max-height:88vh; overflow:auto; box-shadow:0 30px 60px -20px rgba(51,17,91,0.5);
}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.modal-close{background:none; border:none; font-size:20px; color:var(--ink-soft);}

/* ---------- Toast ---------- */
#toast-container{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--purple-900); color:var(--white); padding:13px 18px; border-radius:var(--radius-md);
  box-shadow:0 12px 26px -10px rgba(51,17,91,0.5); font-size:13.5px; font-weight:600;
  display:flex; align-items:center; gap:10px; animation:toastIn .25s ease;
  max-width:320px;
}
.toast.success{background:linear-gradient(120deg,var(--purple-700),var(--success));}
.toast.error{background:linear-gradient(120deg,var(--purple-700),var(--danger));}
@keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

footer{text-align:center; padding:30px; font-size:12px; color:var(--ink-soft);}

/* =========================================================
   CONTROL DE BENEFICIOS — morado + dorado + blanco
   ========================================================= */
.benefits-scope .hero{
  background:linear-gradient(120deg,var(--purple-900) 0%, #341558 100%);
}
.benefits-scope .hero::before{ color:var(--gold-500); }
.benefits-scope .hero-badge{
  background:rgba(201,162,39,0.16); border:1px solid rgba(221,187,85,0.45); color:var(--gold-100);
}
.benefits-scope .btn-primary{
  background:linear-gradient(120deg,var(--purple-700),var(--gold-500));
  box-shadow:0 10px 22px -8px rgba(201,162,39,0.45);
}
.benefits-scope .btn-primary:hover{ box-shadow:0 14px 26px -8px rgba(201,162,39,0.6); }
.benefits-scope .step-badge{ background:var(--gold-100); color:var(--gold-600); }
.benefits-scope .code-pill{ background:var(--gold-100); color:var(--gold-600); }

.status-chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:999px;
  font-size:12.5px; font-weight:800; white-space:nowrap; letter-spacing:.3px; border:1.5px solid transparent;
}
.status-apto{background:#E4F5EC; color:#1F8A55; border-color:#9FDBBA;}
.status-no_apto{background:#F6DEDB; color:#A03D33; border-color:#E3B2AB;}
.status-pendiente{background:#FFF4D6; color:#8A6A0E; border-color:#EFCF7C;}
.status-utilizado{background:#EDEDED; color:#6E6E6E; border-color:#D2D2D2;}

.status-legend{
  display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center;
  background:var(--white); border:1.5px solid var(--gray-200); border-radius:var(--radius-md);
  padding:14px 18px; margin-bottom:22px;
}
.status-legend-item{
  display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-soft); max-width:260px;
}

.requirements-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-bottom:28px;
}
.req-card{
  background:var(--white); border-radius:var(--radius-md); box-shadow:var(--shadow-soft);
  padding:16px; border-top:4px solid var(--gold-500);
}
.req-card-name{font-weight:700; color:var(--purple-900); margin-bottom:10px; font-size:13.5px;}
.req-card-row{margin-bottom:8px; font-size:12.5px;}
.req-card-row:last-child{margin-bottom:0;}
.req-card-row span{display:block; color:var(--ink-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; margin-bottom:2px;}
.req-card-row strong{color:var(--ink); font-weight:600;}

.dashboard-wrap{
  background:var(--white); border-radius:var(--radius-lg); box-shadow:var(--shadow-card);
  overflow:auto; margin-bottom:26px;
}
.dashboard-wrap table{min-width:640px;}
.dashboard-wrap thead th{ background:var(--purple-900); }
.dashboard-wrap td:first-child{font-weight:700; color:var(--purple-900);}
.dash-num{
  display:inline-flex; align-items:center; justify-content:center; min-width:28px;
  font-family:var(--font-body); font-size:13.5px;
}
.dash-zero{color:var(--ink-soft); font-weight:600;}
.dash-link{
  background:var(--gold-100); color:var(--gold-600); borde
